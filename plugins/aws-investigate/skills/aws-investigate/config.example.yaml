# AWS Investigation Skill - 設定範例
# 複製此檔案為 config.local.yaml 並填入你的值。
# 或讓 skill 在首次執行時透過互動式提問引導你完成設定。
#
# config.local.yaml 已加入 .gitignore，不會意外 commit
# 環境特定或敏感的資訊。

# ─── AWS Profile 預設值 ───────────────────────────────────────────────────────
# 互動式選擇 profile（Phase 1）時，顯示為推薦選項。
aws_profiles:
  production: "my-prod-profile"       # 你的 production AWS CLI profile 名稱
  staging: "my-staging-profile"       # 你的 staging AWS CLI profile 名稱

# ─── Log Group 預設值 ─────────────────────────────────────────────────────────
# 詢問 log group prefix（Phase 2）時，作為預設建議。
default_log_group_prefix: "/app/myservice"

# ─── Log 格式對應 ─────────────────────────────────────────────────────────────
# 對應 log group 到其技術 stack，讓 skill 使用正確的查詢語法。
# 常見格式（依你的 tech stack 調整）：
#   python_structlog：level, event, logger, exc_info, lineno
#   nuxt_ssr（pino）：level, namespace, msg, err.data.statusCode
#   其他框架：先用 Scan 1 Step 0 探索實際 log 格式，再自行新增格式定義
log_formats:
  python_structlog:
    - "/app/myservice/api"
    - "/app/myservice/tasks"     # 背景任務（Celery / worker 等），與 API 共用查詢
  nuxt_ssr:
    - "/app/myservice/web"
    - "/app/myservice/frontend"

# ─── 後端 Error 識別關鍵字 ────────────────────────────────────────────────────
# Scan 1 第一層用這些關鍵字 filter 外部 API 呼叫失敗的 log。
# 第二層用 unhandled_exception 關鍵字 filter 未捕獲 exception。
# 留空則使用 Scan 1 Step 0 通用探索查詢。
backend_error_keywords:
  external_api_failure: ""               # 如 "occur ERROR"、"HTTP request failed"、"request error"
  unhandled_exception: "Exception in ASGI"  # ASGI 通用（FastAPI / Starlette）；其他框架填入對應的未捕獲 exception 關鍵字

# ─── Error Type 欄位 ─────────────────────────────────────────────────────────
# Error log 中 error type（如 ApimTimeoutError）的存放位置。
# 不同框架的 error type 存在不同欄位，影響 Scan 1 第三·五層的彙總查詢。
# 首次設定可透過 codebase 掃描自動偵測。留空則掃描時動態探索。
error_type_field:
  python_structlog: "exc_info.0"          # structlog 的 exception chain 第一個元素
  # nuxt_ssr: "err.type"                  # pino 的 error type 欄位

# ─── Trace ID 設定 ────────────────────────────────────────────────────────────
# 專案 log 中的 trace ID 欄位。啟用後調查工具箱支援 trace discovery
# 和 trace-based 去重。留空或省略此 section 則使用純 log-only 模式。
trace_id:
  backend_field: "amz_trace_id"             # 後端 log 中的 trace ID 獨立欄位名
  frontend_pattern: '"X-Amzn-Trace-Id":"'   # 前端 log 中 trace ID 的 @message 搜尋 pattern
  format: "Root=1-{hex8}-{hex24}"           # 格式描述（人讀用）
  search_fragment_length: 8                 # 搜尋用的 hex fragment 長度

# ─── Athena（ALB Log 分析）────────────────────────────────────────────────────
# Scan 4（ALB 查詢）需要。若不使用 Athena 可留空或省略。
# output location 由 workgroup 設定決定，不需要在此指定。
athena:
  workgroup: "my-athena-workgroup"
  tables:
    - "alb_logs_backend"
    - "alb_logs_frontend"

# ─── Redis Key Prefix ────────────────────────────────────────────────────────
# T5（Redis Memory 調查）時用來 scan key pattern。
# 只寫前綴，不含尾部的冒號或星號——skill 會自動加上 ":*"。
redis_key_prefixes:
  session: "myapp:session"
  cache: "myapp:cache"
  # 視需要新增更多前綴：
  # auth_cache: "myapp:auth"

# ─── 報告輸出 ─────────────────────────────────────────────────────────────────
report_dir: "reports/aws-investigate"

# ─── 相關 Codebase Repo ──────────────────────────────────────────────────────
# 調查中追蹤呼叫鏈時，可能需要跨 repo 查看程式碼。
# 列出相關 repo 的本地路徑，讓 skill 在 T4 程式碼追查時能自動搜尋。
# 若只有當前 repo，可留空或省略此設定。
related_repos:
  - "~/GitRepos/my-backend-api"
  - "~/GitRepos/my-frontend-web"

# ─── 時區 ─────────────────────────────────────────────────────────────────────
# 報告中的時間顯示和計算使用。
timezone:
  offset_hours: 8           # UTC 偏移小時數（如 8 代表 UTC+8，-5 代表 UTC-5）
  label: "TWN"              # 報告中使用的時區簡稱
